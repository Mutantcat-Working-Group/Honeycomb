name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libdbus-1-dev libssl-dev libatspi2.0-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtmultimedia qtwebsockets qtserialport'
          cache: true

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Resolve dependencies
        run: |
          conan profile detect --force
          conan install . --output-folder=build/conan-deps --build=missing -s build_type=Release

      - name: Configure
        run: |
          # shellcheck disable=SC2155
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ATSPI_PC="$(dpkg -L libatspi2.0-dev 2>/dev/null | grep -F 'atspi-2.pc' | head -n1 || true)"
          if [ -n "$ATSPI_PC" ]; then
            # shellcheck disable=SC2155
            export PKG_CONFIG_PATH="$(dirname "$ATSPI_PC"):${PKG_CONFIG_PATH}"
          fi
          pkg-config --exists atspi-2
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/build/conan-deps/conan_toolchain.cmake" \
          -DCMAKE_PREFIX_PATH="$PWD/build/conan-deps;${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2022
            qt_arch: win64_msvc2022_64
          - os: darwin
            arch: arm64
            runner: macos-15
            qt_arch: clang_64
            cmake_arch: arm64
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            qt_arch: clang_64
            cmake_arch: x86_64
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64
    env:
      APP_NAME: Honeycomb
      BINARY_NAME: appHoneycomb
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}
      VERSION: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtwebengine qtpositioning qtwebchannel qtmultimedia qtwebsockets qtserialport'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf desktop-file-utils libgl1-mesa-dev libdbus-1-dev libssl-dev libatspi2.0-dev
          # Ubuntu 24.04 renamed the 64-bit time_t audio package.
          for PKG in libasound2t64 libasound2; do
            if apt-cache show "${PKG}" >/dev/null 2>&1; then
              sudo apt-get install -y "${PKG}"
              break
            fi
          done
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libnss3 libnspr4 libegl1 libgl1 libdrm2 libgbm1 libfontconfig1 libxrender1 libxi6 libxtst6
          for PKG in libevent-2.1-7t64 libevent-2.1-7; do
            if apt-cache show "${PKG}" >/dev/null 2>&1; then
              sudo apt-get install -y "${PKG}"
              break
            fi
          done
          for PKG in libminizip1t64 libminizip1; do
            if apt-cache show "${PKG}" >/dev/null 2>&1; then
              sudo apt-get install -y "${PKG}"
              break
            fi
          done

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Resolve dependencies
        run: |
          conan profile detect --force
          conan install . --output-folder=build/conan-deps --build=missing -s build_type=Release -s compiler.cppstd=17

      - name: Configure
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CONFIGURATION_TYPES=Release
          -DCMAKE_TOOLCHAIN_FILE="$PWD/build/conan-deps/conan_toolchain.cmake"
          -DCMAKE_PREFIX_PATH="$PWD/build/conan-deps;${QT_ROOT_DIR}"
          ${{ matrix.os == 'darwin' && format('-DCMAKE_OSX_ARCHITECTURES="{0}"', matrix.cmake_arch) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Build Windows NSIS installer
        if: matrix.os == 'windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          choco install nsis -y --no-progress
          mkdir -p dist/stage
          EXE="$(find build -name 'appHoneycomb.exe' -print -quit)"
          cp "${EXE}" dist/stage/appHoneycomb.exe
          cp LICENSE.txt dist/stage/LICENSE.txt
          windeployqt --release --qmldir . --no-translations dist/stage/appHoneycomb.exe
          makensis -V2 \
            -DVERSION="${VERSION}" \
            -DSTAGING_DIR="$(cygpath -w "${GITHUB_WORKSPACE}/dist/stage")" \
            -DPROJECT_DIR="$(cygpath -w "${GITHUB_WORKSPACE}")" \
            -DINSTALLER_NAME="$(cygpath -w "${GITHUB_WORKSPACE}/dist/${APP_NAME}-${VERSION}-windows-${ARCH}-setup.exe")" \
            sdk/NSIS/Honeycomb.nsi

      - name: Build macOS app and DMG
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_ARCH="${ARCH}"
          if [ "${ARCH}" = "amd64" ]; then PKG_ARCH="x86_64"; fi

          MACDEPLOYQT="${QT_ROOT_DIR:-}/bin/macdeployqt"
          if [ ! -x "${MACDEPLOYQT}" ]; then MACDEPLOYQT="$(command -v macdeployqt)"; fi

          SOURCE_BUNDLE="$(find build -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${SOURCE_BUNDLE}" ]; then
            echo "::error::the build produced no .app bundle"
            exit 1
          fi

          # Keep the bundle name CMake generated (蜂巢工具箱) instead of the
          # internal project name, otherwise Finder shows "Honeycomb.app".
          BUNDLE_NAME="$(basename "${SOURCE_BUNDLE}")"
          STAGING="dist/dmg-${PKG_ARCH}"
          DMG="dist/${BUNDLE_NAME%.app}-${VERSION}-macOS-${PKG_ARCH}.dmg"

          rm -rf "${STAGING}"
          mkdir -p dist "${STAGING}"
          ditto "${SOURCE_BUNDLE}" "${STAGING}/${BUNDLE_NAME}"

          "${MACDEPLOYQT}" "${STAGING}/${BUNDLE_NAME}" \
            -always-overwrite -codesign=- -qmldir="${GITHUB_WORKSPACE}"

          # macdeployqt hands work to helper processes that can outlive it, so
          # anything copied afterwards would slip past the signature.
          for _ in $(seq 60); do
            pgrep -f "macdeployqt .*${STAGING}" >/dev/null 2>&1 || break
            sleep 2
          done

          xattr -cr "${STAGING}/${BUNDLE_NAME}"
          codesign --force --deep --sign - \
            --identifier org.mutantcat.honeycomb \
            --requirements '=designated => identifier "org.mutantcat.honeycomb"' \
            "${STAGING}/${BUNDLE_NAME}"

          # The Applications shortcut is what makes the image drag-to-install.
          ln -s /Applications "${STAGING}/Applications"
          for REQUIRED in "${STAGING}/${BUNDLE_NAME}" "${STAGING}/Applications"; do
            if [ ! -e "${REQUIRED}" ]; then
              echo "::error::staging is missing ${REQUIRED}"
              exit 1
            fi
          done

          hdiutil create -volname "${BUNDLE_NAME%.app} ${VERSION} ${PKG_ARCH}" \
            -srcfolder "${STAGING}" -ov -format UDZO "${DMG}"
          codesign --force --sign - "${DMG}"
          echo "built ${DMG}"

      - name: Verify macOS DMG
        if: matrix.os == 'darwin'
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_ARCH="${ARCH}"
          if [ "${ARCH}" = "amd64" ]; then PKG_ARCH="x86_64"; fi
          STAGING="dist/dmg-${PKG_ARCH}"
          BUNDLE_NAME="$(basename "$(find "${STAGING}" -maxdepth 1 -name '*.app' -print -quit)")"
          APP="${STAGING}/${BUNDLE_NAME}"
          DMG="dist/${BUNDLE_NAME%.app}-${VERSION}-macOS-${PKG_ARCH}.dmg"

          codesign --verify --deep --strict "${APP}"
          echo "signature OK, identifier: $(codesign -d -r- "${APP}" 2>&1 | sed -n 's/^designated => //p')"

          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Contents/Info.plist")"
          EXEC="${APP}/Contents/MacOS/${EXEC_NAME}"
          ARCHS="$(lipo -archs "${EXEC}")"
          echo "executable ${EXEC_NAME} architectures: ${ARCHS}"
          if ! printf '%s\n' "${ARCHS}" | tr ' ' '\n' | grep -qx "${PKG_ARCH}"; then
            echo "::error::${DMG} does not contain ${PKG_ARCH}"
            exit 1
          fi

          LEAKED="$(otool -L "${EXEC}" | grep -E '/Users/|/opt/homebrew|/usr/local' || true)"
          if [ -n "${LEAKED}" ]; then
            echo "::error::bundle still references build-machine paths:"
            echo "${LEAKED}"
            exit 1
          fi

          hdiutil verify "${DMG}"

          # Prove the image really mounts with the app and its drop target.
          MOUNT="$(mktemp -d)"
          VOLUME=""
          cleanup() {
            if [ -n "${VOLUME}" ]; then hdiutil detach "${VOLUME}" -quiet || true; fi
            rmdir "${MOUNT}" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "${DMG}" -mountroot "${MOUNT}" -nobrowse -quiet

          # The mount point can lag behind a successful hdiutil attach.
          for _ in $(seq 30); do
            VOLUME="$(find "${MOUNT}" -maxdepth 1 -mindepth 1 -type d -print -quit 2>/dev/null || true)"
            if [ -n "${VOLUME}" ]; then break; fi
            sleep 1
          done
          if [ -z "${VOLUME}" ]; then
            echo "::error::could not mount ${DMG}"
            exit 1
          fi

          # Every assertion has to run while the volume is still mounted.
          APP_COUNT="$(find "${VOLUME}" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')"
          SHORTCUT="$(find "${VOLUME}" -maxdepth 1 -name 'Applications' -print -quit)"
          if [ -n "${SHORTCUT}" ] && [ -L "${SHORTCUT}" ]; then SHORTCUT_OK=yes; else SHORTCUT_OK=no; fi

          if [ "${APP_COUNT}" -ne 1 ]; then
            echo "::error::${DMG} contains ${APP_COUNT} app bundles, expected 1"
            exit 1
          fi
          if [ "${SHORTCUT_OK}" != yes ]; then
            echo "::error::${DMG} is missing the Applications shortcut"
            exit 1
          fi
          echo "DMG verified: ${DMG} (app plus Applications shortcut)"

      - name: Build Linux AppImage
        if: matrix.os == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APPDIR="dist/${APP_NAME}.AppDir"
          BINARY="$(find build -maxdepth 1 -name "${BINARY_NAME}" -type f -print -quit)"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/applications" "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          cp "${BINARY}" "${APPDIR}/usr/bin/${BINARY_NAME}"
          chmod +x "${APPDIR}/usr/bin/${BINARY_NAME}"
          cat > "${APPDIR}/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Name[zh_CN]=蜂巢工具箱
          Comment=Honeycomb offline toolbox
          Exec=${BINARY_NAME}
          Icon=${APP_NAME}
          Categories=Utility;Development;
          Terminal=false
          EOF
          cp "${APPDIR}/${APP_NAME}.desktop" "${APPDIR}/usr/share/applications/${APP_NAME}.desktop"
          cp logo.png "${APPDIR}/${APP_NAME}.png"
          cp logo.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
          if [ "${ARCH}" = "amd64" ]; then
            LD_ARCH="x86_64"
          else
            LD_ARCH="aarch64"
          fi
          curl -fsSL -o "linuxdeploy-${LD_ARCH}.AppImage" "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LD_ARCH}.AppImage"
          curl -fsSL -o "linuxdeploy-plugin-qt-${LD_ARCH}.AppImage" "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${LD_ARCH}.AppImage"
          curl -fsSL -o "appimagetool-${LD_ARCH}.AppImage" "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${LD_ARCH}.AppImage"
          chmod +x "linuxdeploy-${LD_ARCH}.AppImage" "linuxdeploy-plugin-qt-${LD_ARCH}.AppImage" "appimagetool-${LD_ARCH}.AppImage"
          export PATH="${PWD}:${PATH}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS="${PWD}"
          QT_BIN_DIR="${QT_ROOT_DIR}/bin"
          export PATH="${QT_BIN_DIR}:${PATH}"
          export QMAKE="${QT_BIN_DIR}/qmake"
          export QTDIR="${QT_ROOT_DIR}"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH}"
          "./linuxdeploy-${LD_ARCH}.AppImage" --appdir "${APPDIR}" --plugin qt
          "./appimagetool-${LD_ARCH}.AppImage" "${APPDIR}" "dist/${APP_NAME}-${VERSION}-linux-${ARCH}.AppImage"

      - name: Collect installer assets
        run: |
          # The job-level VERSION env keeps the tag's "v" prefix, so strip it
          # here exactly like every build step does.
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_ARCH="${ARCH}"
          if [ "${ARCH}" = "amd64" ]; then PKG_ARCH="x86_64"; fi
          mkdir -p release
          if [ "${OS}" = "windows" ]; then
            cp dist/*setup.exe "release/${APP_NAME}-${VERSION}-windows-${ARCH}.exe"
          elif [ "${OS}" = "darwin" ]; then
            # GitHub strips every non-ASCII byte out of a release asset name,
            # so a DMG named after the Chinese bundle would be published as
            # "-<version>-macOS-<arch>.dmg". Derive the uploaded name from
            # APP_NAME instead; the bundle inside the image keeps its Chinese
            # name, which is what Finder and /Applications show.
            DMG_SRC="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
            if [ -z "${DMG_SRC}" ]; then
              echo "::error::the darwin build produced no .dmg"
              exit 1
            fi
            cp "${DMG_SRC}" "release/${APP_NAME}-${VERSION}-macOS-${PKG_ARCH}.dmg"
          elif [ "${OS}" = "linux" ]; then
            cp dist/*.AppImage "release/${APP_NAME}-${VERSION}-linux-${ARCH}.AppImage"
          else
            echo "::error::unsupported matrix os ${OS}"
            exit 1
          fi
          if find release -type f -name "*-v${VERSION}-*" | grep -q .; then
            echo "::error::installer assets still carry the tag's v prefix"
            find release -type f -name "*-v${VERSION}-*"
            exit 1
          fi
          # An ASCII-only assert catches the mangled-asset-name failure mode
          # here instead of letting a stripped name reach the release.
          NON_ASCII="$(find release -type f | LC_ALL=C grep '[^ -~]' || true)"
          if [ -n "${NON_ASCII}" ]; then
            echo "::error::release asset names must be ASCII only:"
            echo "${NON_ASCII}"
            exit 1
          fi
          if find release -type f -name '-*' | grep -q .; then
            echo "::error::release asset names must not start with a dash"
            find release -type f -name '-*'
            exit 1
          fi
          ASSET_COUNT="$(find release -type f | wc -l | tr -d ' ')"
          if [ "${ASSET_COUNT}" -lt 1 ]; then
            echo "::error::no installer asset collected for ${OS}/${ARCH}"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          ASSET_COUNT="$(find . -type f | wc -l | tr -d ' ')"
          if [ "${ASSET_COUNT}" -lt 1 ]; then
            echo "::error::no release assets downloaded, refusing to checksum an empty set"
            exit 1
          fi
          # Same ASCII-only guard as the collect step, in case a stripped name
          # was already baked into an artifact.
          NON_ASCII="$(find . -type f | LC_ALL=C grep '[^ -~]' || true)"
          if [ -n "${NON_ASCII}" ]; then
            echo "::error::refusing to publish non-ASCII asset names:"
            echo "${NON_ASCII}"
            exit 1
          fi
          # -r keeps xargs from hashing empty stdin when the set is empty.
          find . -type f -print0 | sort -z | xargs -0 -r sha256sum > ../checksums.txt
          find . -type f -print0 | sort -z | xargs -0 -r md5sum > ../checksums-md5.txt
          find . -type f -print0 | sort -z | xargs -0 -r sha1sum > ../checksums-sha1.txt
          for SUM in ../checksums.txt checksums-md5.txt checksums-sha1.txt; do
            if [ "$(wc -l < "${SUM}" | tr -d ' ')" -ne "${ASSET_COUNT}" ]; then
              echo "::error::${SUM} line count does not match the asset count"
              exit 1
            fi
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* \
              checksums.txt checksums-md5.txt checksums-sha1.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* \
              checksums.txt checksums-md5.txt checksums-sha1.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
